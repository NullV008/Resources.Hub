name: Sync offer catalog

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync from public catalog
        run: python3 sync_from_source.py

      - name: Open pull request for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="auto-sync/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: auto sync offer catalog"
          git push origin "HEAD:$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: auto sync offer catalog ($(date -u +%Y-%m-%d))" \
            --body "Automated catalog sync. Review docs/sync-status.md for added/removed items before merging." \
            --repo "${{ github.repository }}"
